<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>简单登录页</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(160deg, #eef2ff 0%, #f8fafc 45%, #f1f5f9 100%);
      color: #0f172a;
    }

    .login-card {
      width: min(92vw, 380px);
      padding: 28px;
      border-radius: 16px;
      background: #ffffff;
      box-shadow: 0 20px 40px rgba(15, 23, 42, 0.12);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 24px;
      text-align: center;
    }

    .hint {
      margin: 0 0 20px;
      text-align: center;
      color: #475569;
      font-size: 14px;
    }

    form {
      display: grid;
      gap: 14px;
    }

    label {
      display: grid;
      gap: 6px;
      font-size: 14px;
      font-weight: 600;
      color: #334155;
    }

    input {
      width: 100%;
      height: 40px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      padding: 0 12px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s ease;
    }

    input:focus {
      border-color: #6366f1;
    }

    button {
      margin-top: 4px;
      height: 42px;
      border: 0;
      border-radius: 10px;
      background: #4f46e5;
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.05s ease, opacity 0.2s ease;
    }

    button:hover {
      opacity: 0.95;
    }

    button:active {
      transform: translateY(1px);
    }

    .message {
      min-height: 20px;
      margin-top: 10px;
      text-align: center;
      font-size: 14px;
    }

    .message.success {
      color: #16a34a;
    }

    .message.error {
      color: #dc2626;
    }
  </style>
</head>
<body>
  <main class="login-card">
    <h1>欢迎登录</h1>
    <p class="hint">请输入账号和密码</p>

    <form id="loginForm" novalidate>
      <label>
        用户名
        <input id="username" name="username" type="text" autocomplete="username" placeholder="请输入用户名" required />
      </label>

      <label>
        密码
        <input id="password" name="password" type="password" autocomplete="current-password" placeholder="请输入密码" required />
      </label>

      <button type="submit">登录</button>
    </form>

    <div id="message" class="message" aria-live="polite"></div>
  </main>

  <script>
    const form = document.getElementById('loginForm');
    const messageEl = document.getElementById('message');

    form.addEventListener('submit', (event) => {
      event.preventDefault();

      const username = form.username.value.trim();
      const password = form.password.value;

      if (!username || !password) {
        messageEl.textContent = '用户名和密码不能为空';
        messageEl.className = 'message error';
        return;
      }

      messageEl.textContent = `登录成功，欢迎你：${username}`;
      messageEl.className = 'message success';
    });
  </script>
</body>
</html>
